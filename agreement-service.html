<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agreement & Document · Ground Experience Portal</title><script>document.documentElement.classList.add("r9-boot")</script><link rel="stylesheet" href="assets/portal.css?v=10.5"></head><body><header class="top"></header><div class="shell"><aside class="side"></aside><main class="main"><div class="ge-page-head"><div><h1>Agreement & Document</h1><p>Agreement validity, service availability, dan document reference per station.</p></div><div class="ge-page-actions"><a class="ge-btn" href="readiness.html">Readiness</a></div></div><section class="ge-summary-strip"><div><small>Agreements</small><b id="mA">—</b></div><div><small>Effective</small><b id="mE">—</b></div><div><small>Expired</small><b id="mX">—</b></div><div><small>Stations with Agreement</small><b id="mS">—</b></div><div><small>Available Services</small><b id="mV">—</b></div></section><section class="ge-panel"><div class="ge-form-row"><label>Station<select id="station"></select></label><label>As of<input id="asof" type="date"></label><label>Search<input id="search" placeholder="Provider / document / type"></label><label>Status<select id="status"><option value="">All</option><option>Effective</option><option>Expired</option><option>Upcoming</option><option>Unknown</option></select></label></div><div id="summary" class="ge-callout"></div><div id="register" class="ge-table-wrap"></div></section></main></div><script src="assets/data.js?v=2.57"></script><script src="assets/auth.js?v=2.57"></script><script src="assets/core-v257.js?v=2.57"></script><script src="assets/relationships-v257.js?v=2.57"></script><script src="assets/network-v257.js?v=2.57"></script><script src="assets/readiness-v257.js?v=2.57"></script><script src="assets/shared-objects-v257.js?v=2.57"></script><script src="assets/customer-experience-v257.js?v=2.57"></script><script src="assets/agreement-v257.js?v=2.57"></script><script src="assets/permission-v257.js?v=2.57"></script><script src="assets/history-v257.js?v=2.57"></script><script src="assets/budget-cost-v257.js?v=2.57"></script><script>(function(){const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sts=()=>GECore.list('stations').sort((a,b)=>String(a.code).localeCompare(String(b.code)));function sc(id){const s=GECore.get('stations',id);return s?s.code:id}function setup(){station.innerHTML=sts().map(x=>`<option value="${esc(x.id)}">${esc(x.code)} — ${esc(x.name)}</option>`).join('');asof.value=new Date().toISOString().slice(0,10)}function render(){const st=GEAgreement.stats(asof.value);mA.textContent=st.agreements;mE.textContent=st.effective;mX.textContent=st.expired;mS.textContent=st.stationsWithAgreement;mV.textContent=st.serviceAvailable;const sm=GEAgreement.stationSummary(station.value,asof.value);summary.innerHTML=`<b>${sm.total} agreement</b><span>${sm.effective} effective · ${sm.expired} expired · ${sm.serviceAvailable} service available</span>`;const q=search.value.toLowerCase(),fs=status.value;let a=GEAgreement.list().map(x=>({...x,effectiveStatus:GEAgreement.asOfStatus(x,asof.value)})).filter(x=>(!fs||x.effectiveStatus===fs)&&(!q||[sc(x.stationId),x.provider,x.documentNumber,x.agreementType].join(' ').toLowerCase().includes(q)));register.innerHTML=`<table><thead><tr><th>Station</th><th>Provider</th><th>Service</th><th>Document</th><th>Validity</th><th>Status</th><th>Availability</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(sc(x.stationId))}</b></td><td>${esc(x.provider)}</td><td>${esc(x.serviceId?(GECore.get('services',x.serviceId)||{}).name:'Mapping Required')}</td><td>${esc(x.agreementType)}<br><small>${esc(x.documentNumber||'—')}</small></td><td>${esc(x.validFrom||'—')} → ${esc(x.evergreen?'Evergreen':x.validTo||'—')}</td><td>${esc(x.effectiveStatus)}</td><td>${x.serviceAvailable===true?'Available':x.serviceAvailable===false?'Not Available':'Unknown'}</td></tr>`).join('')}</tbody></table>`}station.onchange=render;asof.onchange=render;search.oninput=render;status.onchange=render;GEAgreement.bootstrap();setup();render()})();</script><script src="assets/overlay-v30.js?v=30.1" defer></script><script src="assets/access-assistance-p32.js?v=32.1" defer></script><script src="assets/p33-p37-presentation.js?v=37.1" defer></script><script src="assets/portal-shell.js?v=10.5" defer></script></body></html>
