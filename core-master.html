<style>body{background:#f5f7fa}.p11{max-width:1320px;margin:auto;padding:24px}.p11 h1{margin:0;color:#0d2745}.tag{display:inline-block;padding:4px 8px;border:1px solid #ccd5df;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:white;border:1px solid #dde4eb;border-radius:12px;padding:14px}.card b{font-size:24px;color:#0d2745}.tabs{display:flex;gap:6px;overflow:auto;margin:16px 0}.tabs button,.btn{border:1px solid #c7d1dc;background:#fff;padding:8px 11px;border-radius:8px;cursor:pointer}.tabs button.active,.btn.primary{background:#0d2745;color:#fff}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar input{padding:9px;border:1px solid #cbd5df;border-radius:8px;min-width:240px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #e4e9ef;text-align:left;font-size:13px}th{background:#f7f9fb}.muted{color:#667788}.panel{background:white;border:1px solid #dde4eb;border-radius:12px;overflow:auto}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#fff;border-radius:14px;padding:20px;width:min(620px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:#526273}.form input,.form select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd5df;border-radius:8px;margin-top:4px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}</style><script>document.documentElement.classList.add("r9-boot")</script><link rel="stylesheet" href="assets/portal.css?v=10.5"></head><body><div style="background:#fff7df;border-bottom:1px solid #ead9a5;padding:8px 14px;font:12px Arial,sans-serif;color:#5f522c"><b>P1 Validation Mode</b> — halaman Core dapat diuji langsung tanpa login legacy. Ini bukan mekanisme login final portal.</div><main class="p11"><div class="bar"><div><span class="tag">V2.57 · P1.1</span><h1>Core Identity & Master</h1><div class="muted">Additive foundation — V2.55.5 business functions remain untouched.</div></div></div><section class="grid" id="stats"></section><div class="tabs" id="tabs"></div><div class="bar" style="margin-bottom:10px"><input id="q" placeholder="Cari code atau nama…"><button class="btn primary" id="add">+ Add Master</button><button class="btn" id="reset">Reset P1.1 Core</button></div><div class="panel"><table><thead><tr><th>Immutable ID</th><th>Code</th><th>Name</th><th>Relationship / Context</th><th>Status</th><th>Source</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main><div class="modal" id="modal"><div class="box"><h2 id="mt">Add Master</h2><div class="form"><label>Code<input id="code"></label><label>Name<input id="name"></label><label id="airportWrap">Airport<select id="airport"></select></label><label>Status<select id="status"><option>Active</option><option>Inactive</option></select></label></div><div class="bar" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="cancel">Batal</button><button class="btn primary" id="save">Simpan</button></div></div></div>
<script>
const types={organizations:'Organization',airports:'Airport',stations:'Station',journeys:'Journey',touchpoints:'Touch Point',services:'Service',capabilities:'Capability',serviceLocations:'Service Location'};let type='stations',editId=null;
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){const st=GECore.stats();stats.innerHTML=['airports','stations','touchpoints','serviceLocations'].map(k=>`<div class=card><div class=muted>${types[k]}</div><b>${st[k].active}</b><div class=muted>${st[k].total} total</div></div>`).join('');tabs.innerHTML=Object.entries(types).map(([k,v])=>`<button data-k="${k}" class="${k===type?'active':''}">${v}</button>`).join('');const query=q.value.toLowerCase();rows.innerHTML=GECore.list(type,{includeArchived:true}).filter(r=>!query||`${r.code} ${r.name} ${r.id}`.toLowerCase().includes(query)).map(r=>`<tr><td><code>${esc(r.id)}</code></td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td class=muted>${esc(r.airportId||r.journeyId||r.stationId||r.responsibleOrganizationId||'—')}</td><td>${esc(r.lifecycleStatus||r.operationalStatus)}</td><td class=muted>${esc(r.source||'P1.1')}</td><td><button class=btn data-edit="${esc(r.id)}">Edit</button> ${r.lifecycleStatus!=='Archived'?`<button class=btn data-archive="${esc(r.id)}">Archive</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class=muted>Belum ada data.</td></tr>'}
function openForm(r){editId=r&&r.id||null;code.value=r&&r.code||'';name.value=r&&r.name||'';status.value=r&&r.lifecycleStatus==='Inactive'?'Inactive':'Active';airport.innerHTML='<option value="">—</option>'+GECore.list('airports').map(a=>`<option value="${a.id}" ${r&&r.airportId===a.id?'selected':''}>${a.code} — ${a.name}</option>`).join('');airportWrap.style.display=(type==='stations'||type==='serviceLocations')?'block':'none';mt.textContent=(editId?'Edit ':'Add ')+types[type];modal.classList.add('open')}
tabs.onclick=e=>{if(e.target.dataset.k){type=e.target.dataset.k;draw()}};q.oninput=draw;add.onclick=()=>openForm(null);cancel.onclick=()=>modal.classList.remove('open');rows.onclick=e=>{const id=e.target.dataset.edit||e.target.dataset.archive;if(!id)return;if(e.target.dataset.archive){if(confirm('Archive record ini?')){GECore.archive(type,id);draw()}}else openForm(GECore.get(type,id))};save.onclick=()=>{if(!code.value.trim()||!name.value.trim())return alert('Code dan Name wajib diisi.');const old=editId?GECore.get(type,editId):{};const r={...old,code:code.value.trim().toUpperCase(),name:name.value.trim(),lifecycleStatus:status.value};if((type==='stations'||type==='serviceLocations')&&airport.value)r.airportId=airport.value;GECore.upsert(type,r);modal.classList.remove('open');draw()};reset.onclick=()=>{if(confirm('Reset hanya data Core P1.1? Data V2.55.5 tidak berubah.')){GECore.reset();draw()}};draw();
</script><script src="assets/history-v257.js?v=2.57-P1.5"></script><script src="assets/overlay-v30.js?v=30.1" defer></script><script src="assets/access-assistance-p32.js?v=32.1" defer></script><script src="assets/p33-p37-presentation.js?v=37.1" defer></script><script src="assets/portal-shell.js?v=10.5" defer></script></body></html>
