<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station 360</title>

<script src="assets/auth.js?v=2.57"></script><script src="assets/data.js?v=2.57"></script><script src="assets/core-v257.js?v=2.57"></script><script src="assets/relationships-v257.js?v=2.57"></script><script src="assets/network-v257.js?v=2.57"></script><script src="assets/service-location-v257.js?v=2.57"></script><script src="assets/service-chain-v257.js?v=2.57"></script><script src="assets/shared-objects-v257.js?v=2.57"></script><script src="assets/readiness-v257.js?v=2.57"></script><script src="assets/agreement-v257.js?v=2.57"></script><script src="assets/customer-experience-v257.js?v=2.57"></script><script src="assets/station-360-v257.js?v=2.57"></script>
<script>document.documentElement.classList.add("r9-boot")</script><link rel="stylesheet" href="assets/portal.css?v=10.5"></head><body><header class="top"></header><div class="shell"><aside class="side"></aside><main class="main"><div class="ge-page-head"><div><h1>Station Profile / 360</h1><p>One station view: identity, organization, service location, capability, readiness, agreement and CX context.</p></div><div class="ge-page-actions"><a class="ge-btn" href="network-stations.html">← Network</a></div></div><section class="ge-card" style="padding:12px"><div class="ge-network-toolbar" style="grid-template-columns:1fr 190px"><select id="station" class="ge-input"></select><button id="refresh" class="ge-btn primary">Refresh Station 360</button></div></section><div id="content" style="margin-top:10px"></div></main></div>
<script>
(function(){function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function init(){try{GENetwork.bootstrap();GEServiceLocation.bootstrap();GEServiceChain.bootstrap()}catch(e){}const stations=GECore.list('stations').sort((a,b)=>String(a.code).localeCompare(String(b.code))), sel=document.getElementById('station'),qp=new URLSearchParams(location.search).get('stationId');sel.innerHTML=stations.map(s=>`<option value="${esc(s.id)}">${esc(s.code)} — ${esc(s.name)}</option>`).join('');if(qp&&stations.some(x=>x.id===qp))sel.value=qp;else{const u=gxGetSession();const code=(u?.airports||[])[0];const m=stations.find(x=>String(x.code).toUpperCase()===String(code||'').toUpperCase());if(m)sel.value=m.id}sel.onchange=render;document.getElementById('refresh').onclick=render;render()}function kv(label,val){return `<div><span>${esc(label)}</span><b>${esc(val==null||val===''?'Unavailable':val)}</b></div>`}function render(){const id=document.getElementById('station').value;let x;try{x=GEStation360.station360(id)}catch(e){document.getElementById('content').innerHTML=`<section class="ge-card ge-360-card"><b>Station 360 could not be loaded.</b><p>${esc(e.message)}</p></section>`;return}if(!x)return;let rd=null,ag=null,cx=null;try{rd=GEReadiness.stationReadiness(id)}catch(e){}try{ag=GEAgreement.stationSummary(id)}catch(e){}try{cx=GECustomerExperience.stationSummary(id)}catch(e){}document.getElementById('content').innerHTML=`<div class="ge-stat-grid"><div class="ge-card ge-stat"><small>Station</small><b>${esc(x.station.code)}</b><span class="ge-muted" style="font-size:9px">${esc(x.station.name)}</span></div><div class="ge-card ge-stat"><small>Readiness</small><b>${rd&&rd.score!=null?rd.score+'%':'Not Assessed'}</b><span class="ge-muted" style="font-size:9px">${esc(rd?.status||'Unavailable')}</span></div><div class="ge-card ge-stat"><small>Service Locations</small><b>${x.locations.length}</b></div><div class="ge-card ge-stat"><small>Services</small><b>${x.services.length}</b></div></div><div class="ge-360-grid"><section class="ge-card ge-360-card"><div class="ge-panel-head"><h3>Station Identity</h3></div><div class="ge-360-list">${kv('Airport / Context',x.airport?.name||'Non-airport context')}${kv('City',x.profile?.city)}${kv('Region',x.profile?.networkRegion)}${kv('Station Type',x.profile?.stationType)}${kv('Responsible Organization',x.responsibleOrganization?.name||'Mapping Required')}</div></section><section class="ge-card ge-360-card"><div class="ge-panel-head"><h3>Readiness & Capability</h3><a class="ge-link" href="readiness.html">View Detail</a></div><div class="ge-360-list">${kv('Readiness Status',rd?.status)}${kv('Readiness Score',rd?.score==null?'Not Assessed':rd.score+'%')}${kv('Gap',rd?.gaps==null?'Unavailable':rd.gaps)}${kv('Mapped Services',x.services.length)}${kv('Service Locations',x.locations.length)}</div></section><section class="ge-card ge-360-card"><div class="ge-panel-head"><h3>Agreement & CX</h3></div><div class="ge-360-list">${kv('Agreement Status',ag?.status)}${kv('Effective Agreement',ag?.effective)}${kv('Service Available',ag?.total?ag.serviceAvailable:'Unavailable')}${kv('CX Status',cx?.status)}${kv('Published CX',cx?.publishedMeasurements)}</div></section></div><div class="ge-360-grid" style="margin-top:10px"><section class="ge-card ge-360-card" style="grid-column:span 2"><div class="ge-panel-head"><h3>Service Location → Touch Point → Service</h3><a class="ge-link" href="touchpoint.html">Journey & Touch Point</a></div>${locations(x)}</section><section class="ge-card ge-360-card"><div class="ge-panel-head"><h3>Data Attention</h3></div>${x.missing.length?x.missing.map(v=>`<div class="ge-attention-item"><span class="severity medium">Review</span><div><b>${esc(v)}</b><small>Mapping / source data required</small></div><span></span></div>`).join(''):'<span class="ge-badge green">No structural issue</span>'}</section></div>`}function locations(x){if(!x.locations.length)return '<p class="ge-muted" style="font-size:10px">Service Location mapping is not available.</p>';return x.locations.slice(0,8).map(l=>`<div style="padding:7px 0;border-bottom:1px solid #edf1f5"><b style="font-size:10px">${esc(l.location.name)}</b><div class="ge-muted" style="font-size:9px;margin-top:4px">${l.touchpoints.map(t=>esc(t.touchpoint.name)+' → '+t.services.map(s=>esc(s.service.name)).join(', ')).join(' • ')||'Touch Point / Service mapping required'}</div></div>`).join('')}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(init,60));else setTimeout(init,60)})();
</script><script src="assets/overlay-v30.js?v=30.1" defer></script><script src="assets/access-assistance-p32.js?v=32.1" defer></script><script src="assets/p33-p37-presentation.js?v=37.1" defer></script><script src="assets/portal-shell.js?v=10.5" defer></script></body></html>
