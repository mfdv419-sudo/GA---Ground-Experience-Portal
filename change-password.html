<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password · Ground Experience Portal</title>
<script>document.documentElement.classList.add("r9-boot")</script>
<link rel="stylesheet" href="assets/portal.css?v=10.20.1">
<script src="assets/firebase-config.js?v=1"></script>
<script src="assets/firebase-client.js?v=2"></script>
</head>
<body class="p27-password-page">
<main class="p27-password-shell">
  <section class="p27-password-card" aria-labelledby="p27PasswordTitle">
    <div class="p27-password-brand"><span class="p27-eyebrow">SECURITY</span><h1 id="p27PasswordTitle">Change Password</h1><p>Perbarui password akun Anda menggunakan current password. Password tidak pernah disimpan di Firestore.</p></div>
    <div class="p27-password-account"><span>Account</span><b id="p27PasswordAccount">Authenticated User</b><div id="p27TempState" aria-live="polite"></div></div>
    <form id="p27PasswordForm" class="p27-password-form" novalidate>
      <label><span>Current Password</span><div class="p27-password-input"><input id="p27CurrentPassword" type="password" autocomplete="current-password" required><button type="button" id="p27ToggleCurrent" aria-label="Show password" aria-pressed="false">Show</button></div></label>
      <label><span>New Password</span><div class="p27-password-input"><input id="p27NewPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><button type="button" id="p27ToggleNew" aria-label="Show password" aria-pressed="false">Show</button></div><small>Minimal 10 karakter, tanpa spasi, dan tidak boleh sama dengan username/email.</small></label>
      <label><span>Confirm New Password</span><div class="p27-password-input"><input id="p27ConfirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><button type="button" id="p27ToggleConfirm" aria-label="Show password" aria-pressed="false">Show</button></div></label>
      <div id="p27PasswordMessage" class="p27-password-message" aria-live="polite"></div>
      <div class="p27-password-actions"><a class="ge-btn" href="profile.html">Back to Profile</a><button id="p27PasswordSubmit" class="ge-btn primary" type="submit">Update Password</button></div>
    </form>
  </section>
</main>
<script src="assets/auth.js?v=2.57"></script>
<script src="assets/password-p27.js?v=27.1" defer></script>
<script>
(async function(){
  try{
    await GXFirebase.init();
    const u=await GXFirebase.currentUser();
    if(!u){location.replace('login.html?next='+encodeURIComponent('change-password.html'));return;}
    const p=await GXFirebase.currentProfile();
    if(p&&typeof gxSetSession==='function')gxSetSession({...p,uid:u.uid,email:p.email||u.email||''});
  }catch(e){
    const s=typeof gxGetSession==='function'?gxGetSession():null;
    if(!s?.uid)location.replace('login.html?next='+encodeURIComponent('change-password.html'));
  }
})();
</script>
<script src="assets/p33-p37-presentation.js?v=37.1" defer></script>
</body>
</html>
