<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget & Financial · Ground Experience Portal</title><script>document.documentElement.classList.add("r9-boot")</script><link rel="stylesheet" href="assets/portal.css?v=10.5"></head><body><header class="top"></header><div class="shell"><aside class="side"></aside><main class="main"><div class="ge-page-head"><div><h1>Budget & Financial</h1><p>Budget envelope, cost object, allocation, actual cost, and initiative financial trace.</p></div><div class="ge-page-actions"><a class="ge-btn" href="program-kerja.html">Program Kerja Import</a><a class="ge-btn" href="cost-intelligence.html">Cost Intelligence</a></div></div><section class="ge-summary-strip"><div><small>Budget Envelopes</small><b id="mB">—</b></div><div><small>Cost Objects</small><b id="mC">—</b></div><div><small>Allocations</small><b id="mA">—</b></div><div><small>Actual Entries</small><b id="mX">—</b></div></section><div class="ge-two-col"><section class="ge-panel"><div class="ge-panel-head"><h3>Budget Envelope</h3></div><div class="ge-form-grid"><label>Budget Name<input id="bName"></label><label>Planning Year<input id="bYear" type="number" value="2027"></label><label>Currency<input id="bCur" value="IDR"></label><label>Approved Amount<input id="bAmt" type="number" placeholder="Leave blank if not approved"></label><label>Status<select id="bStatus"><option>Draft</option><option>Proposed</option><option>Approved</option><option>Closed</option></select></label><label>Approval Reference<input id="bRef"></label><div class="ge-form-action"><button class="ge-btn primary" id="saveBudget">Save Budget</button></div></div></section><section class="ge-panel"><div class="ge-panel-head"><h3>Cost Object</h3></div><div class="ge-form-grid"><label>Name<input id="cName"></label><label>Initiative<select id="cInit"></select></label><label>Category<select id="cCat"><option>CAPEX</option><option>OPEX</option><option>Service Fee</option><option>Rental</option><option>Maintenance</option><option>Other</option></select></label><label>Currency<input id="cCur" value="IDR"></label><label>Owner / PIC<input id="cOwner"></label><label>Status<select id="cStatus"><option>Planning</option><option>Active</option><option>Closed</option></select></label><div class="ge-form-action"><button class="ge-btn primary" id="saveCO">Save Cost Object</button></div></div></section></div><section class="ge-panel"><div class="ge-panel-head"><h3>Budget & Cost Register</h3></div><div id="register" class="ge-table-wrap"></div></section></main></div><script src="assets/data.js?v=2.57"></script><script src="assets/auth.js?v=2.57"></script><script src="assets/core-v257.js?v=2.57"></script><script src="assets/relationships-v257.js?v=2.57"></script><script src="assets/network-v257.js?v=2.57"></script><script src="assets/readiness-v257.js?v=2.57"></script><script src="assets/shared-objects-v257.js?v=2.57"></script><script src="assets/customer-experience-v257.js?v=2.57"></script><script src="assets/agreement-v257.js?v=2.57"></script><script src="assets/permission-v257.js?v=2.57"></script><script src="assets/history-v257.js?v=2.57"></script><script src="assets/budget-cost-v257.js?v=2.57"></script><script>(function(){const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function initiatives(){return GEStore.get().initiatives||[]}function opt(sel,rows,label,fn){sel.innerHTML='<option value="">'+label+'</option>'+rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(fn(x))+'</option>').join('')}function val(id){return $(id).value.trim()}function num(id){return val(id)===''?null:Number(val(id))}function fmt(v,c='IDR'){return v==null?'Unavailable':esc(c)+' '+Number(v).toLocaleString('id-ID')}function refresh(){const s=GEBudgetCost.stats();mB.textContent=s.budgets;mC.textContent=s.costObjects;mA.textContent=s.allocations;mX.textContent=s.actuals;const d=GEBudgetCost.read();opt(cInit,initiatives(),'Optional / standalone',x=>x.name);register.innerHTML='<table><thead><tr><th>Type</th><th>Name</th><th>Context</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+d.budgets.map(x=>`<tr><td>Budget</td><td>${esc(x.name)}</td><td>${esc(x.year||'')}</td><td>${fmt(x.approvedAmount,x.currency)}</td><td>${esc(x.status)}</td></tr>`).join('')+d.costObjects.map(x=>`<tr><td>Cost Object</td><td>${esc(x.name)}</td><td>${esc((initiatives().find(i=>String(i.id)===String(x.initiativeId))||{}).name||'Standalone')}</td><td>—</td><td>${esc(x.status)}</td></tr>`).join('')+'</tbody></table>'}saveBudget.onclick=()=>{if(!val('bName'))return alert('Budget Name wajib diisi.');GEBudgetCost.save('budgets',{name:val('bName'),year:val('bYear'),currency:val('bCur'),approvedAmount:num('bAmt'),status:val('bStatus'),approvalReference:val('bRef')});refresh()};saveCO.onclick=()=>{if(!val('cName'))return alert('Cost Object Name wajib diisi.');GEBudgetCost.save('costObjects',{name:val('cName'),initiativeId:val('cInit'),category:val('cCat'),currency:val('cCur'),owner:val('cOwner'),status:val('cStatus')});refresh()};refresh()})();</script><script src="assets/overlay-v30.js?v=30.1" defer></script><script src="assets/access-assistance-p32.js?v=32.1" defer></script><script src="assets/p33-p37-presentation.js?v=37.1" defer></script><script src="assets/portal-shell.js?v=10.5" defer></script></body></html>
