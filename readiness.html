<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readiness & Compliance · Ground Experience Portal</title><script>document.documentElement.classList.add("r9-boot")</script><link rel="stylesheet" href="assets/portal.css?v=10.5"></head><body><header class="top"></header><div class="shell"><aside class="side"></aside><main class="main"><div class="ge-page-head"><div><h1>Readiness & Compliance</h1><p>Service standard, requirement, assessment, gap, dan evidence per station.</p></div><div class="ge-page-actions"><a class="ge-btn" href="agreement-service.html">Agreement & Document</a></div></div><section class="ge-summary-strip"><div><small>Standards</small><b id="mStd">—</b></div><div><small>Requirements</small><b id="mReq">—</b></div><div><small>Assessments</small><b id="mAss">—</b></div><div><small>Ready Stations</small><b id="mReady">—</b></div><div><small>Open Gaps</small><b id="mGap">—</b></div></section><div class="ge-two-col"><section class="ge-panel"><div class="ge-panel-head"><h3>Station Readiness</h3></div><div class="ge-form-row"><label>Station<select id="stationPick"></select></label><button id="refresh" class="ge-btn">Refresh</button></div><div id="summary" class="ge-callout"></div><div id="stdTable" class="ge-table-wrap"></div></section><section class="ge-panel"><div class="ge-panel-head"><h3>Gap Register</h3></div><div id="gaps" class="ge-table-wrap"></div></section></div><section class="ge-panel"><div class="ge-panel-head"><h3>Record Assessment</h3></div><div class="ge-form-grid"><label>Requirement<select id="assReq"></select></label><label>Result<select id="assResult"><option>Compliant</option><option>Partial</option><option>Not Compliant</option><option>Not Applicable</option><option>Not Assessed</option></select></label><label class="span2">Gap / Observation<textarea id="assGap"></textarea></label><label>Assessed By<input id="assBy"></label><label>Remarks<input id="assRemarks"></label><div class="ge-form-action"><button class="ge-btn primary" id="saveAss">Save Assessment</button></div></div></section></main></div><script src="assets/data.js?v=2.57"></script><script src="assets/auth.js?v=2.57"></script><script src="assets/core-v257.js?v=2.57"></script><script src="assets/relationships-v257.js?v=2.57"></script><script src="assets/network-v257.js?v=2.57"></script><script src="assets/readiness-v257.js?v=2.57"></script><script src="assets/shared-objects-v257.js?v=2.57"></script><script src="assets/customer-experience-v257.js?v=2.57"></script><script src="assets/agreement-v257.js?v=2.57"></script><script src="assets/permission-v257.js?v=2.57"></script><script src="assets/history-v257.js?v=2.57"></script><script src="assets/budget-cost-v257.js?v=2.57"></script><script>(function(){const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setup(){const sts=GECore.list('stations').sort((a,b)=>String(a.code).localeCompare(String(b.code)));stationPick.innerHTML=sts.map(x=>`<option value="${esc(x.id)}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}function options(){const ss=GEReadiness.listStandards({stationId:stationPick.value});const reqs=GEReadiness.listRequirements().filter(r=>ss.some(s=>s.id===r.standardId));assReq.innerHTML=reqs.length?reqs.map(r=>`<option value="${esc(r.id)}">${esc((ss.find(s=>s.id===r.standardId)||{}).name)} — ${esc(r.requirement)}</option>`).join(''):'<option value="">Belum ada Requirement</option>'}function render(){const s=GEReadiness.stats();mStd.textContent=s.standards;mReq.textContent=s.requirements;mAss.textContent=s.assessments;mReady.textContent=s.stationsReady;mGap.textContent=s.gaps;const r=GEReadiness.stationReadiness(stationPick.value);summary.innerHTML=`<b>${r.score==null?'Unavailable':r.score+'%'}</b><span>${esc(r.status)} · ${r.gaps} gap</span>`;stdTable.innerHTML=r.standards.length?`<table><thead><tr><th>Standard</th><th>Status</th><th>Requirements</th><th>Assessed</th><th>Score</th><th>Gaps</th></tr></thead><tbody>${r.standards.map(x=>`<tr><td><b>${esc(x.standard.name)}</b></td><td>${esc(x.status)}</td><td>${x.requirements}</td><td>${x.assessed}</td><td>${x.score==null?'Unavailable':x.score+'%'}</td><td>${x.gaps}</td></tr>`).join('')}</tbody></table>`:'<p class="ge-muted">Belum ada Service Standard untuk station ini.</p>';const gg=GEReadiness.gaps(stationPick.value);gaps.innerHTML=gg.length?`<table><thead><tr><th>Requirement</th><th>Result</th><th>Gap</th><th>Evidence</th></tr></thead><tbody>${gg.map(x=>`<tr><td>${esc(x.requirement&&x.requirement.requirement)}</td><td>${esc(x.assessment.result)}</td><td>${esc(x.assessment.gap||'Belum dijelaskan')}</td><td>${x.evidence.length}</td></tr>`).join('')}</tbody></table>`:'<p class="ge-muted">Belum ada gap yang tercatat.</p>';options()}saveAss.onclick=()=>{try{GEReadiness.assess({stationId:stationPick.value,requirementId:assReq.value,result:assResult.value,gap:assGap.value,remarks:assRemarks.value,assessedBy:assBy.value||undefined});assGap.value='';assRemarks.value='';render()}catch(e){alert(e.message)}};refresh.onclick=render;stationPick.onchange=render;setup();render()})();</script><script src="assets/overlay-v30.js?v=30.1" defer></script><script src="assets/access-assistance-p32.js?v=32.1" defer></script><script src="assets/p33-p37-presentation.js?v=37.1" defer></script><script src="assets/portal-shell.js?v=10.5" defer></script></body></html>
