<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Ground Experience Portal</title>
<script src="assets/firebase-config.js?v=1"></script>
<script src="assets/firebase-client.js?v=2"></script>
<script src="assets/auth.js?v=2.58"></script>
<link rel="stylesheet" href="assets/portal.css?v=10.6">
</head>
<body>
<section class="login-page"><div class="login-card"><div class="login-brand"><div class="login-logos"><div class="garuda-logo" aria-label="Garuda Indonesia">GARUDA INDONESIA</div><img class="danantara-logo" src="assets/danantara.png" alt="Danantara Indonesia"></div><h1>Ground Experience Portal</h1><p>Internal Service Experience Workspace</p></div>
<form class="login-form" id="loginForm"><label for="loginUser">Username / Email</label><input id="loginUser" autocomplete="username" required><label for="loginPass">Password</label><input id="loginPass" type="password" autocomplete="current-password" required><button class="login-submit" id="loginSubmit" type="submit">Masuk</button><div id="loginError" class="login-error" role="alert"></div><div class="login-note">Gunakan akun yang sudah terdaftar pada Firebase Authentication. Jika menggunakan username lama, profile <code>users/{uid}</code> harus memiliki email yang sama dengan akun Firebase.</div></form>
</div></section>
<script>
(async()=>{
  try{await GXFirebase.init();const u=await GXFirebase.currentUser();if(u){const cached=gxGetSession();if(cached&&String(cached.uid||'')===String(u.uid))location.replace(gxConsumeReturnTo()||gxDefaultPage());else{try{await gxSyncFirebaseSession();location.replace(gxConsumeReturnTo()||gxDefaultPage())}catch(e){console.warn('Firebase session restore:',e)}}}}catch(e){console.warn('Firebase init:',e)}
})();
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();loginError.style.display='none';loginSubmit.disabled=true;loginSubmit.textContent='Memproses…';
  try{
    const user=await gxAuthenticate(loginUser.value,loginPass.value);
    if(!user)throw new Error('INVALID_CREDENTIALS');
    const session={...user,loginAt:Date.now(),authProvider:'firebase'};gxSetSession(session);gxAuditDirect('Login','Authentication','Session','User logged in',session);location.replace(gxConsumeReturnTo()||gxDefaultPage());
  }catch(err){
    const messages={
      INVALID_CREDENTIALS:'Username/email atau password tidak sesuai.',
      ACCOUNT_INACTIVE:'Akun tidak aktif.',
      USER_EMAIL_MISSING:'Profile user belum memiliki email untuk Authentication Firebase.',
      USERNAME_LOOKUP_UNAVAILABLE:'Username tidak dapat dicari sebelum login. Gunakan email Firebase untuk masuk.',
      PROFILE_ACCESS_DENIED:'Akun berhasil diautentikasi, tetapi profile users tidak dapat dibaca oleh Firestore Rules.',
      FIREBASE_UNAVAILABLE:'Firebase tidak dapat dihubungi. Periksa koneksi, Firebase config, dan domain yang diizinkan.',
      AUTH_PROVIDER_DISABLED:'Provider Email/Password Firebase belum diaktifkan.',
      AUTH_INVALID_EMAIL:'Format email tidak valid.',
      AUTH_UNAUTHORIZED_DOMAIN:'Domain website ini belum diizinkan di Firebase Authentication → Settings → Authorized domains.'
    };
    loginError.textContent=messages[err?.message]||('Login gagal: '+(err?.message||'unknown error'));
    loginError.style.display='block';loginSubmit.disabled=false;loginSubmit.textContent='Masuk';
  }
});
</script>
<script src="assets/v2544-modal-fix.js?v=2.54.4" defer></script><script src="assets/v2554-stability.js?v=2.55.5" defer></script><script src="assets/portal-shell.js?v=10.5" defer></script>
</body></html>
