<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Ground Experience Portal</title>
<script src="assets/firebase-config.js?v=1"></script>
<script src="assets/firebase-client.js?v=1"></script>
<script src="assets/auth.js?v=2.56.0"></script>
<script>document.documentElement.classList.add("r9-boot")</script><link rel="stylesheet" href="assets/portal.css?v=10.5">
</head>
<body>
<section class="login-page"><div class="login-card"><div class="login-brand"><div class="login-logos"><img class="garuda-logo" src="assets/garuda-indonesia.png" alt="Garuda Indonesia"><img class="danantara-logo" src="assets/danantara.png" alt="Danantara Indonesia"></div><h1>Ground Experience Portal</h1><p>Internal Service Experience Workspace</p></div>
<form class="login-form" id="loginForm"><label for="loginUser">Username</label><input id="loginUser" autocomplete="username"><label for="loginPass">Password</label><input id="loginPass" type="password" autocomplete="current-password"><button class="login-submit" id="loginSubmit" type="submit">Masuk</button><div id="loginError" class="login-error"></div><div class="login-note">Gunakan akun yang sudah terdaftar pada Firebase Authentication dan profile <code>users/{uid}</code>.</div></form>
</div></section>
<script>
(async()=>{
  try{await GXFirebase.init();const u=await GXFirebase.currentUser();if(u){await gxSyncFirebaseSession();location.replace(gxConsumeReturnTo()||gxDefaultPage())}}catch(e){}
})();
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();loginError.style.display='none';loginSubmit.disabled=true;loginSubmit.textContent='Memproses…';
  try{
    const user=await gxAuthenticate(loginUser.value,loginPass.value);
    if(!user)throw new Error('INVALID_CREDENTIALS');
    const session={...user,loginAt:Date.now(),authProvider:'firebase'};gxSetSession(session);gxAuditDirect('Login','Authentication','Session','User logged in',session);location.replace(gxConsumeReturnTo()||gxDefaultPage());
  }catch(err){
    const messages={INVALID_CREDENTIALS:'Username/password tidak sesuai atau akun tidak aktif.',ACCOUNT_INACTIVE:'Akun tidak aktif.',USER_EMAIL_MISSING:'Profile user belum memiliki email untuk authentication Firebase.',FIREBASE_UNAVAILABLE:'Firebase tidak dapat dihubungi.'};
    loginError.textContent=messages[err?.message]||'Login gagal. Periksa konfigurasi Firebase atau akun Anda.';loginError.style.display='block';loginSubmit.disabled=false;loginSubmit.textContent='Masuk';
  }
});
</script>
<script src="assets/v2544-modal-fix.js?v=2.54.4" defer></script><script src="assets/v2554-stability.js?v=2.55.5" defer></script><script src="assets/portal-shell.js?v=10.5" defer></script>
</body></html>
